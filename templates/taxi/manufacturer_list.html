{% extends "base.html" %}

{% block content %}
  <h1>Manufacturers</h1>

  <ul>
    {% for manufacturer in manufacturer_list %}
      <li>
        {{ manufacturer.name }}
        <a href="{% url 'taxi:manufacturer-detail' manufacturer.id %}">View</a>
      </li>
    {% empty %}
      <p>There are no manufacturers in the service.</p>
    {% endfor %}
  </ul>

  <a href="{% url 'taxi:manufacturer-create' %}">Add new manufacturer</a>
{% endblock %}
